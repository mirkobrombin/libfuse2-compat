name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        compiler: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config libfuse3-dev libfuse-dev
      - name: Build and test
        env:
          CC: ${{ matrix.compiler }}
        run: make check

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfuse3-dev libfuse-dev
      - name: Address and undefined behavior sanitizers
        env:
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: make check

  legacy-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl fuse3
      - name: Verify a real legacy AppImage loads the bridge
        run: make check-legacy-loader

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts pkg-config libfuse3-dev libfuse-dev
      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b
      - name: Collect package
        run: |
          mkdir -p dist
          mv ../libfuse2-compat_*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb
